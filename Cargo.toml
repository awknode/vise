[package]
name = "vise"
version = "0.3.2"
edition = "2021"
authors = ["awk studios"]
description = "VISE: six-model compressor (vari-mu, DS, FAT, ALPHA, SH-A, SH-B)"

[workspace]
members = ["xtask"]

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
# AWKNODE: our nice-plug fork (~/Projects/nice-plug-awk), mounted at /nice-plug-awk by build.sh
nice-plug = { path = "/nice-plug-awk/crates/nice-plug" }
nice-plug-egui = { path = "/nice-plug-awk/crates/nice-plug-egui" }
egui = { version = "0.37.0", default-features = false, features = ["bytemuck"] }
serde_json = "1"
realfft = "3"
atomic_float = "1.1"

[profile.release]
lto = "thin"
strip = "symbols"

